mouse:
  gestures:
    # down right: close window
    - type: stroke
      strokes: ['AAcALQUrFDIFXC/9ZFJkAA==']
      mouse_buttons: [right]
      actions:
        - on: end
          input:
            - keyboard: [leftctrl+w]
    # up: home
    - type: stroke
      strokes: ['MmQA0TU6KcsuAGQA']
      mouse_buttons: [right]
      actions:
        - on: end
          input:
            - keyboard: [home]
    # down: end
    - type: stroke
      strokes: ['LwAAMDRkZAA=']
      mouse_buttons: [right]
      actions:
        - on: end
          input:
            - keyboard: [end]
