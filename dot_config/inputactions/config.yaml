#      mouse_buttons: [right]
#      actions:
#        - on: end
#          input:
#            - keyboard: []
#    # right: next
#    - type: stroke
#      strokes: []
#      mouse_buttons: [right]
#      actions:
#        - on: end
#          input:
#            - keyboard: []
    # up left: previous tab
    - type: stroke
      strokes: ['ZFoAzWELLJ4RCVpdAAxkAA==']
      actions:
        - on: end
          input:
            - keyboard: [leftctrl+pageup]
    # up right: next tab
    - type: stroke
      strokes: ['AFUAzwAPKABBDk8FZBVkAA==']
      actions:
        - on: end
          input:
            - keyboard: [leftctrl+pagedown]
